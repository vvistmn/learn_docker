---
exclude: "migrations/.*|docker/nginx/.*"

always_run: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
        args:
          - requirements/base.txt
          - requirements/development.txt
          - requirements/production.txt
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
        exclude: "docker/nginx/ssl/default.key"
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - --indent
          - "4"
          - --no-sort-keys
          - --no-ensure-ascii
        exclude: .releaserc.json
      - id: name-tests-test
        args:
          - --pytest-test-first
      - id: no-commit-to-branch
        args:
          - --branch
          - "master"
  - repo: local
    hooks:
      - id: pip_check
        name: pip_check
        entry: pip check
        language: system

      - id: autoflake
        name: autoflake
        entry: autoflake
        language: system

      - id: dotenv-linter
        name: dotenv-linter
        entry: dotenv-linter
        language: system
        files: \.env\.template

      - id: pyupgrade
        name: pyupgrade
        entry: pyupgrade
        language: system
        types:
          - python
        args:
          - --py38-plus

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types:
          - python
